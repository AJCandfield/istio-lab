apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/description: Workloads must use a namespace other than default.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Workload
    policies.kyverno.io/title: Disallow Default Namespace
  name: disallow-default-namespace
spec:
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - daemonsets
          - deployments
          - replicasets
          - statefulsets
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - cronjobs
          - jobs
  validationActions:
    - Deny
  validations:
    - expression: namespaceObject.metadata.name != 'default'
      message: Using the default namespace for workloads is not allowed.
