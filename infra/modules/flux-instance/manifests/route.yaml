apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: flux
  namespace: istio-ingress
spec:
  gateways:
    - local
  hosts:
    - flux.localhost
  http:
    - route:
        - destination:
            host: flux-operator.flux.svc.cluster.local
            port:
              number: 9080
