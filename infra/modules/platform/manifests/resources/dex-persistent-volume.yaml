apiVersion: v1
kind: PersistentVolume
metadata:
  name: dex
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  hostPath:
    path: /var/lib/istio-lab/dex
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage.istio-lab/dex
              operator: In
              values:
                - "true"
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
