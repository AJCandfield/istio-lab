apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  chart:
    spec:
      chart: base
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      version: "1.31.1"
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    defaultRevision: default
    global:
      platform: k3d
