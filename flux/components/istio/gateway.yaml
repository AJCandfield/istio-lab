apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingress
  namespace: istio-ingress
spec:
  chart:
    spec:
      chart: gateway
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      version: "1.31.1"
  dependsOn:
    - name: istiod
      namespace: istio-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      platform: k3d
