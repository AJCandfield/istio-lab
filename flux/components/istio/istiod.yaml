apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  chart:
    spec:
      chart: istiod
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      version: "1.31.1"
  dependsOn:
    - name: istio-base
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      platform: k3d
    pilot:
      resources:
        requests:
          memory: 512Mi
