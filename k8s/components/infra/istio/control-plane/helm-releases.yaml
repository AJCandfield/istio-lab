apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
spec:
  chart:
    spec:
      chart: base
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      version: "1.31.1"
  driftDetection:
    mode: warn
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
spec:
  chart:
    spec:
      chart: istiod
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      version: "1.31.1"
  dependsOn:
    - name: istio-base
  driftDetection:
    mode: warn
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
