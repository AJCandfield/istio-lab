apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
spec:
  chart:
    spec:
      chart: dex
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: dex
        namespace: flux
      version: "0.24.1"
  driftDetection:
    mode: warn
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
