apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      version: "3.9.1"
  driftDetection:
    mode: warn
  install:
    remediation:
      retries: 3
  interval: 30m
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    admissionController:
      podAnnotations:
        sidecar.istio.io/inject: "false"
      replicas: 1
    backgroundController:
      enabled: true
      podAnnotations:
        sidecar.istio.io/inject: "false"
      replicas: 1
    cleanupController:
      enabled: true
      podAnnotations:
        sidecar.istio.io/inject: "false"
      replicas: 1
    reportsController:
      enabled: true
      podAnnotations:
        sidecar.istio.io/inject: "false"
      replicas: 1
