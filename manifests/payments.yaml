apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: istio-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        version: v1
    spec:
      containers:
        - name: payments
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:8080"
            - "-text=Hello from PAYMENTS v1"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: istio-lab
spec:
  selector:
    app: payments
  ports:
    - port: 8080
      targetPort: 8080
