repositories:
  - name: kyverno
    url: https://kyverno.github.io/kyverno

helmDefaults:
  kubeContext: k3d-istio-lab
  wait: true
  timeout: 300

releases:
  - name: kyverno
    namespace: kyverno
    chart: kyverno/kyverno
    version: 3.9.1
    values:
      - values.yaml
    labels:
      stack: kyverno
