repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-renovate
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 80c8033123f6d6b9ccd1a9458562ea4180742af7 # frozen: v1.109.2
    hooks:
      - id: terraform_docs
        name: terraform docs for changed modules
        args:
          - --hook-config=--tool-version=0.24.0
          - --args=--config=infra/modules/.terraform-docs.yml
        files: ^infra/modules/(?!\.boilerplate/)[^/]+/.*\.tf$
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: mise exec -- terraform fmt -check -recursive infra/modules
        language: system
        pass_filenames: false
      - id: terragrunt-hcl-format
        name: terragrunt hcl format
        entry: mise exec -- terragrunt hcl format --check --working-dir infra/live
        language: system
        pass_filenames: false
