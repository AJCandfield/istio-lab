repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-renovate
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: mise exec -- terraform fmt -check -recursive infra/modules
        language: system
        pass_filenames: false
      - id: terragrunt-hcl-format
        name: terragrunt hcl format
        entry: mise exec -- terragrunt hcl format --check --working-dir infra/live
        language: system
        pass_filenames: false
      - id: validate-manifests
        name: validate Kubernetes manifests
        entry: mise exec -- scripts/validate-manifests.sh
        language: system
        pass_filenames: false
