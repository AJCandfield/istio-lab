apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: istio-lab

# Server nodes run the Kubernetes control plane and datastore.
servers: 1
# Agent nodes run application workloads without control-plane components.
agents: 1
image: rancher/k3s:v1.36.5-k3s1

kubeAPI:
  host: localhost
  hostIP: 127.0.0.1
  hostPort: "6550"

ports:
  - port: "8080:80"
    nodeFilters:
      - loadbalancer
  - port: "8443:443"
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: 120s
  k3s:
    # Extra arguments are passed to matching k3s server or agent processes.
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --service-cidr=10.1.0.0/16
        nodeFilters:
          - server:*
      - arg: --cluster-cidr=10.10.0.0/16
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
