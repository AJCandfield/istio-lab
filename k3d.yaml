apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: istio-lab

servers: 1
agents: 1
image: rancher/k3s:v1.36.5-k3s1

kubeAPI:
  host: localhost
  hostIP: 127.0.0.1
  hostPort: "6550"

ports:
  - port: "8080:80"
    nodeFilters:
      - loadbalancer
  - port: "8443:443"
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: 120s
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
