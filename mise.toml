[env]
HELM_DIFF_VERSION = "3.15.15"

[tools]
helm = "4.3.0"
helm-diff = { version = "{{ env.HELM_DIFF_VERSION }}", postinstall = 'ln -sf helm-diff "$MISE_TOOL_INSTALL_PATH/diff/bin/diff"' }
helmfile = "1.8.1"
k3d = "5.9.0"
kubectl = "1.37.1"
kubectx = "0.11.0"
kubens = "0.11.0"
istioctl = "1.31.1"
just = "1.58.0"
pre-commit = "4.6.2"

[tasks."helm-diff:update"]
description = "Install or update Helm Diff to the pinned version"
quiet = true
run = '''
previous_version="$(helm diff version 2>/dev/null || printf 'not installed')"
helm plugin uninstall diff 2>/dev/null || true
SKIP_BIN_INSTALL=1 helm plugin install "$(mise where helm-diff)/diff"
current_version="$(helm diff version)"
printf 'Helm Diff: %s -> %s\n' "$previous_version" "$current_version"
'''
