apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: main
  namespace: flux-system
spec:
  dependsOn:
    - name: istio-ingress
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: frontend
      namespace: main
    - apiVersion: apps/v1
      kind: Deployment
      name: orders
      namespace: main
    - apiVersion: apps/v1
      kind: Deployment
      name: payments
      namespace: main
  interval: 10m
  path: ./live/local/namespaces/main
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
