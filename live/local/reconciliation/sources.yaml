apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sources
  namespace: flux
spec:
  healthChecks:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: istio
      namespace: flux
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      name: kyverno
      namespace: flux
  interval: 10m
  path: ./live/local/namespaces/flux
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
