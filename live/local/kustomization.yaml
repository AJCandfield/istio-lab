# This file is the Kustomize entry point for the local cluster.
#
# During bootstrap, the Flux Operator creates a root Flux Kustomization named
# flux-system. It watches the live/local directory in the Git repository and
# uses this file to apply the child Flux Kustomizations listed below. Each child
# reconciles one part of the cluster, while its spec.dependsOn field defines the
# reconciliation DAG. The order of the resources below does not control when
# they run.
#
# Useful operator commands:
#   flux get kustomizations --all-namespaces
#   flux reconcile kustomization flux-system --namespace flux --with-source
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces/flux/reconciliation.yaml
  - namespaces/istio-system/reconciliation.yaml
  - namespaces/istio-ingress/reconciliation.yaml
  - namespaces/kyverno/reconciliation.yaml
  - _global/kyverno-policies/reconciliation.yaml
  - namespaces/main/reconciliation.yaml
