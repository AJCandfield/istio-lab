apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: istio-ingress
resources:
  - namespace.yaml
  - ../../../../k8s/components/infra/istio/ingress
  - gateway.yaml
  - routes/dex.yaml
  - routes/flux.yaml
configMapGenerator:
  - name: istio-ingress-values
    files:
      - values.yaml=values/gateway.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: istio-ingress
    patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: ConfigMap
            name: istio-ingress-values
            valuesKey: values.yaml
