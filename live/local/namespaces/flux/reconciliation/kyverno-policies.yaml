apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux
spec:
  dependsOn:
    - name: kyverno
  interval: 10m
  path: ./live/local/_global/kyverno-policies
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux
  timeout: 5m
