apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: main
  namespace: flux
spec:
  dependsOn:
    - name: istio-ingress
  interval: 10m
  path: ./live/local/namespaces/main
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux
  timeout: 5m
  wait: true
